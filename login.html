{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="text-center mb-4">Login</h3>

                <form method="POST">

                    <input type="email"
                           name="email"
                           class="form-control mb-3"
                           placeholder="Email">

                    <input type="password"
                           name="password"
                           class="form-control mb-3"
                           placeholder="Password">

                    <button class="btn btn-primary w-100">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
